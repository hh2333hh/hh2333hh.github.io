{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="文章分页">
  {{ with .Prev }}<a href="{{ .URL }}" rel="prev">上一页</a>{{ else }}<span>上一页</span>{{ end }}
  <span>{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{ with .Next }}<a href="{{ .URL }}" rel="next">下一页</a>{{ else }}<span>下一页</span>{{ end }}
</nav>
{{ end }}
