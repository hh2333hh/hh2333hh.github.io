name: Publish blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive_name="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive_name}" "${release_url}/${archive_name}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo_checksums.txt" "${release_url}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          sha256sum --check --ignore-missing hugo_checksums.txt
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${archive_name}" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build blog
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${PAGES_BASE_URL%/}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
